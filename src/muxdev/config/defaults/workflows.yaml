workflows:
  change:
    name: change
    stages:
      - id: plan
        role: plan
        default_skills: ["plan=default-plan"]
        read_only: true
        output_schema: PlanResult
      - id: approve_plan
        type: human_gate
        deps: [plan]
        approval_type: plan
        approval_reason: approve the current plan subject
      - id: implement
        role: code
        default_skills: ["code=default-code"]
        deps: [approve_plan]
        allow_write: true
        output_schema: ChangeResult
      - id: test
        role: test
        default_skills: ["test=default-test"]
        deps: [implement]
        read_only: true
        allow_shell: true
        output_schema: TestResult
      - id: review
        role: review
        default_skills: ["review=default-review"]
        deps: [test, security_review]
        read_only: true
        output_schema: ReviewResult
      - id: security_review
        role: secure
        default_skills: ["secure=default-secure"]
        deps: [test]
        when: profile.strict
        read_only: true
        output_schema: ReviewResult
      - id: fix
        role: code
        default_skills: ["code=default-code"]
        deps: [review]
        when: review.has_blockers and loop < 2
        allow_write: true
        output_schema: ChangeResult

  design:
    name: design
    stages:
      - id: design
        role: architect
        default_skills: ["plan=default-plan"]
        read_only: true
        output_schema: PlanResult
      - id: review
        role: review
        default_skills: ["review=default-review"]
        deps: [design]
        read_only: true
        output_schema: ReviewResult
      - id: revise
        role: architect
        default_skills: ["plan=default-plan"]
        deps: [review]
        when: review.has_blockers and loop < 2
        read_only: true
        output_schema: PlanResult
      - id: approve
        type: human_gate
        deps: [review, revise]
        approval_type: plan
        approval_reason: approve the current design subject

  review:
    name: review
    stages:
      - id: review
        role: review
        default_skills: ["review=default-review"]
        read_only: true
        output_schema: ReviewResult
      - id: approve
        type: human_gate
        deps: [review]
        approval_type: review
        approval_reason: acknowledge the current review subject

  test:
    name: test
    stages:
      - id: test_plan
        role: test_strategy
        default_skills: ["test_strategy=default-test"]
        read_only: true
        output_schema: PlanResult
      - id: approve_plan
        type: human_gate
        deps: [test_plan]
        approval_type: plan
        approval_reason: approve the current verification plan
      - id: test
        role: test
        default_skills: ["test=default-test"]
        deps: [approve_plan]
        read_only: true
        allow_shell: true
        output_schema: TestResult
      - id: review
        role: review
        default_skills: ["review=default-review"]
        deps: [test]
        read_only: true
        output_schema: ReviewResult

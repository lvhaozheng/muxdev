cli_adapters:
  mock:
    cli_id: mock
    command: [python, -m, muxdev.runtime.mock_cli]
    env_allowlist: []
    supports_pty: false
    supports_resize: false
    supports_resume: false
  codex:
    cli_id: codex
    command: [codex, --no-alt-screen]
    resume_command: [codex, --no-alt-screen, resume, "{native_session_id}"]
    working_directory_arg: -C
    model_arg: --model
    env_allowlist: [OPENAI_API_KEY, OPENAI_BASE_URL]
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: true
    native_session_id_pattern: '(?i)(?:session(?: id)?|resume)[:= ]+([0-9a-f-]{20,})'
    prefer_tmux: true
  claude-code:
    cli_id: claude-code
    command: [claude]
    resume_command: [claude, --resume, "{native_session_id}"]
    model_arg: --model
    env_allowlist: [ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL]
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: true
    prefer_tmux: true
  qwen:
    cli_id: qwen
    command: [qwen]
    env_allowlist: [QWEN_API_KEY, DASHSCOPE_API_KEY, OPENAI_API_KEY, OPENAI_BASE_URL]
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: false
    prefer_tmux: true
  kimi:
    cli_id: kimi
    command: [kimi]
    env_allowlist: [KIMI_API_KEY, MOONSHOT_API_KEY, OPENAI_API_KEY, OPENAI_BASE_URL]
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: false
    prefer_tmux: true
  trae:
    cli_id: trae
    command: [trae]
    env_allowlist: []
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: false
    prefer_tmux: true
  antigravity:
    cli_id: antigravity
    command: [antigravity]
    env_allowlist: []
    supports_pty: true
    requires_pty: true
    supports_resize: true
    supports_resume: false
    prefer_tmux: true

agents:
  mock:
    agent_id: mock
    display_name: Mock Agent
    cli_id: mock
    role_prompt: Deterministic local agent for tests and offline demonstrations.
    capability_tags: [code, terminal]
    max_concurrency: 4
    default_permissions: workspace-write
    enabled: true
  mock-review:
    agent_id: mock-review
    display_name: Mock Reviewer
    cli_id: mock

providers:
  mock:
    mode: builtin
    commands: [mock]
    status_hint: P0
    probe: mock
    notes: built-in deterministic provider for workflow and matrix tests
    runtime:
      kind: mock
  codex:
    mode: local CLI
    commands: [codex]
    status_hint: P0
    probe: codex
    runtime:
      kind: headless_cli
      command:
        - codex
        - --ask-for-approval
        - never
        - exec
        - --json
        - --skip-git-repo-check
        - --sandbox
        - workspace-write
      prompt_transport: stdin
  claude-code:
    mode: local CLI
    commands: [claude, claude-code]
    status_hint: P0/P1
    probe: generic
    runtime:
      kind: headless_cli
      command: [claude, -p, "{prompt}", --output-format, stream-json, --verbose]
  qwen:
    mode: local CLI
    commands: [qwen]
    status_hint: P0/P1
    probe: generic
    runtime:
      kind: headless_cli
      command: [qwen, --bare, --sandbox, --approval-mode, auto, --output-format, stream-json, --max-tool-calls, "40", -p]
  kimi:
    mode: local CLI
    commands: [kimi]
    status_hint: P2
    probe: generic
    runtime:
      kind: headless_cli
      command: [kimi]
  trae:
    mode: IDE/shell
    commands: [trae]
    status_hint: P2
    probe: generic
    runtime:
      kind: headless_cli
      command: [trae]
  antigravity:
    mode: beta
    commands: [antigravity]
    status_hint: P2
    probe: generic
    runtime:
      kind: headless_cli
      command: [antigravity]
